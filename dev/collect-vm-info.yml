---
# =============================================================================
# ALAR VM Information Collector Playbook
# Run: ansible-playbook -i inventory collect-vm-info.yml
# Output: /var/www/html/results.json (single JSON file with all hosts)
# =============================================================================
- name: Collect boot process details from Azure VMs
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # ─── 1. IDENTITY ─────────────────────────────────────────────────────────
    - name: Get date
      command: date -u +%Y-%m-%dT%H:%M:%SZ
      register: r_date
      changed_when: false

    - name: Get architecture
      command: uname -m
      register: r_arch
      changed_when: false

    - name: Get kernel version
      command: uname -r
      register: r_kernel
      changed_when: false

    - name: Get os-release
      command: cat /etc/os-release
      register: r_os_release
      changed_when: false

    # ─── 2. IMDS (Azure Instance Metadata) ───────────────────────────────────
    - name: Query IMDS compute metadata
      shell: >
        curl -s -H "Metadata:true" --noproxy "*"
        "http://169.254.169.254/metadata/instance/compute?api-version=2021-02-01"
      register: r_imds_compute
      changed_when: false
      failed_when: false

    - name: Query IMDS image reference
      shell: >
        curl -s -H "Metadata:true" --noproxy "*"
        "http://169.254.169.254/metadata/instance/compute/storageProfile/imageReference?api-version=2021-02-01"
      register: r_imds_image
      changed_when: false
      failed_when: false

    # ─── 3. BOOT MODE ────────────────────────────────────────────────────────
    - name: Check if EFI firmware directory exists
      stat:
        path: /sys/firmware/efi
      register: r_efi_dir

    - name: Get secure boot state
      command: mokutil --sb-state
      register: r_secureboot
      changed_when: false
      failed_when: false

    # ─── 4. DISK & PARTITION LAYOUT ──────────────────────────────────────────
    - name: Get block device list
      command: lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINT,UUID,PARTTYPE
      register: r_lsblk
      changed_when: false
      failed_when: false

    - name: Get root disk device name
      # Handles: partitions (sda1→sda), NVMe (nvme0n1p3→nvme0n1),
      # LVM (/dev/mapper/rootvg-rootlv → PV → disk),
      # btrfs subvols (strips [/@/...] suffix)
      shell:
        cmd: |
          SRC=$(findmnt -n -o SOURCE / | sed 's/\[.*\]//')
          DISK=$(lsblk -ndo PKNAME "$SRC" 2>/dev/null | head -1)
          if [ -z "$DISK" ]; then
            PV=$(pvs --noheadings -o pv_name -S "lv_dm_path=$SRC" 2>/dev/null | tr -d ' ' | head -1)
            [ -n "$PV" ] && DISK=$(lsblk -ndo PKNAME "$PV" 2>/dev/null | head -1)
          fi
          [ -z "$DISK" ] && DISK=$(lsblk -ndo NAME "$SRC" 2>/dev/null | head -1)
          echo "$DISK"
      register: r_root_disk
      changed_when: false
      failed_when: false

    - name: Get partition table of root disk
      shell: sgdisk -p "/dev/{{ r_root_disk.stdout | trim }}"
      register: r_sgdisk
      changed_when: false
      failed_when: false
      when: r_root_disk.stdout | trim | length > 0

    - name: Check NVMe presence
      shell: lsblk -ndo NAME | grep -q '^nvme' && echo "yes" || echo "no"
      register: r_nvme
      changed_when: false
      failed_when: false

    - name: List NVMe devices
      shell: |
        if command -v nvme &>/dev/null; then
          OUTPUT=$(nvme list 2>/dev/null)
          if [ -n "$OUTPUT" ]; then
            echo "$OUTPUT"
          else
            echo "nvme command present but no devices listed"
          fi
        else
          echo "nvme cli not installed"
        fi
      register: r_nvme_list
      changed_when: false
      failed_when: false

    - name: Count SCSI hosts
      shell: ls /sys/class/scsi_host/ 2>/dev/null | wc -l
      register: r_scsi_hosts
      changed_when: false
      failed_when: false

    # ─── 5. LVM ──────────────────────────────────────────────────────────────
    - name: Get PVs
      command: pvs
      register: r_pvs
      changed_when: false
      failed_when: false

    - name: Get VGs
      command: vgs
      register: r_vgs
      changed_when: false
      failed_when: false

    - name: Get LVs
      command: lvs
      register: r_lvs
      changed_when: false
      failed_when: false

    # ─── 6. MOUNT POINTS ─────────────────────────────────────────────────────
    - name: Get real mount points
      command: findmnt -t ext4,xfs,btrfs,vfat,ext2,ext3 --real
      register: r_mounts
      changed_when: false
      failed_when: false

    - name: Get EFI mount details
      shell: |
        if findmnt /boot/efi &>/dev/null; then
          echo "mount: $(findmnt -n /boot/efi)"
          echo "fs: $(findmnt -n -o FSTYPE /boot/efi)"
          echo "source: $(findmnt -n -o SOURCE /boot/efi)"
          echo "uuid: $(blkid -s UUID -o value "$(findmnt -n -o SOURCE /boot/efi)")"
        else
          echo "efi_mount: none"
        fi
      register: r_efi_mount
      changed_when: false
      failed_when: false

    - name: Get boot mount details
      shell: |
        if findmnt /boot &>/dev/null; then
          echo "mount: $(findmnt -n /boot)"
          echo "fs: $(findmnt -n -o FSTYPE /boot)"
          echo "source: $(findmnt -n -o SOURCE /boot)"
          echo "uuid: $(blkid -s UUID -o value "$(findmnt -n -o SOURCE /boot)")"
        else
          echo "boot_mount: none (boot on root)"
        fi
      register: r_boot_mount
      changed_when: false
      failed_when: false

    # ─── 7. FSTAB ────────────────────────────────────────────────────────────
    - name: Get fstab contents
      command: cat /etc/fstab
      register: r_fstab
      changed_when: false

    # ─── 8. GRUB PACKAGES ────────────────────────────────────────────────────
    - name: Get GRUB/shim packages (rpm)
      shell: rpm -qa | grep -iE "grub|shim" | sort
      register: r_grub_pkgs_rpm
      changed_when: false
      failed_when: false

    - name: Get GRUB/shim packages (dpkg)
      shell: dpkg -l 2>/dev/null | grep -iE "grub|shim" | awk '{print $2, $3}'
      register: r_grub_pkgs_dpkg
      changed_when: false
      failed_when: false

    # ─── 9. GRUB BINARIES ────────────────────────────────────────────────────
    - name: Check GRUB binaries availability
      shell: |
        for cmd in grub2-install grub-install grub2-mkconfig grub-mkconfig update-grub grubby; do
          if command -v "$cmd" &>/dev/null; then
            echo "$cmd: $(command -v "$cmd") ($($cmd --version 2>/dev/null || echo 'no version'))"
          else
            echo "$cmd: not found"
          fi
        done
      register: r_grub_binaries
      changed_when: false
      failed_when: false

    # ─── 10. OS-PROBER ───────────────────────────────────────────────────────
    - name: Check os-prober
      shell: |
        if command -v os-prober &>/dev/null; then
          echo "installed: $(command -v os-prober)"
          rpm -q os-prober 2>/dev/null || dpkg -l os-prober 2>/dev/null || true
        else
          echo "not installed"
        fi
      register: r_osprober
      changed_when: false
      failed_when: false

    # ─── 11. GRUB DEFAULT CONFIG ─────────────────────────────────────────────
    - name: Get /etc/default/grub
      command: cat /etc/default/grub
      register: r_default_grub
      changed_when: false
      failed_when: false

    - name: List /etc/default/grub.d/
      shell: ls -la /etc/default/grub.d/ 2>/dev/null || echo "NOT FOUND"
      register: r_grubd_list
      changed_when: false
      failed_when: false

    - name: Get /etc/default/grub.d/ file contents
      shell: |
        if [ -d /etc/default/grub.d ]; then
          for f in /etc/default/grub.d/*; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            cat "$f"
            echo
          done
        else
          echo "NOT FOUND"
        fi
      register: r_grubd_contents
      changed_when: false
      failed_when: false

    # ─── 12. GRUB.CFG FILES ─────────────────────────────────────────────────
    - name: Locate and inspect grub.cfg files
      shell:
        cmd: |
          for f in /boot/grub2/grub.cfg /boot/grub/grub.cfg /boot/efi/EFI/*/grub.cfg; do
            [ -f "$f" ] || continue
            echo "FOUND: $f ($(stat -c '%s bytes, %y' "$f"))"
            echo "  sha256: $(sha256sum "$f" | awk '{print $1}')"
            echo "  lines: $(wc -l < "$f")"
            if grep -q "blscfg" "$f" 2>/dev/null; then
              echo "  type: BLS shim"
            elif head -20 "$f" | grep -q "BEGIN.*grub-mkconfig\|BEGIN.*grub2-mkconfig" 2>/dev/null; then
              echo "  type: full generated grub.cfg"
            else
              echo "  type: custom/manual"
            fi
            echo "  first_30_lines:"
            head -30 "$f" | sed 's/^/    /'
            echo
          done
      register: r_grubcfg
      changed_when: false
      failed_when: false

    # ─── 12b. EFI grub.cfg redirect vs standalone check ──────────────────────
    - name: Analyze EFI grub.cfg relationship to boot grub.cfg
      shell:
        cmd: |
          # Identify the main grub.cfg on the boot filesystem
          BOOT_GRUBCFG=""
          if [ -f /boot/grub2/grub.cfg ]; then
            BOOT_GRUBCFG="/boot/grub2/grub.cfg"
          elif [ -f /boot/grub/grub.cfg ]; then
            BOOT_GRUBCFG="/boot/grub/grub.cfg"
          fi

          # Find all EFI grub.cfg files
          EFI_GRUBCFGS=$(find /boot/efi/EFI -name grub.cfg 2>/dev/null)

          if [ -z "$EFI_GRUBCFGS" ]; then
            echo "efi_grubcfg_found: false"
            echo "status: no_efi_grubcfg"
            exit 0
          fi

          for efi_cfg in $EFI_GRUBCFGS; do
            echo "--- $efi_cfg ---"
            LINE_COUNT=$(wc -l < "$efi_cfg")
            echo "line_count: $LINE_COUNT"

            # Check if it's a redirect/shim (small file with configfile/source or search+prefix)
            HAS_CONFIGFILE=$(grep -c 'configfile' "$efi_cfg" 2>/dev/null || echo 0)
            HAS_SOURCE=$(grep -c 'source ' "$efi_cfg" 2>/dev/null || echo 0)
            HAS_SEARCH=$(grep -c 'search' "$efi_cfg" 2>/dev/null || echo 0)
            HAS_SET_PREFIX=$(grep -c 'set prefix=' "$efi_cfg" 2>/dev/null || echo 0)
            HAS_BLSCFG=$(grep -c 'blscfg' "$efi_cfg" 2>/dev/null || echo 0)
            HAS_MENUENTRY=$(grep -c 'menuentry' "$efi_cfg" 2>/dev/null || echo 0)
            HAS_MKCONFIG=$(grep -c 'BEGIN /etc/grub\.d' "$efi_cfg" 2>/dev/null || echo 0)
            HAS_NORMAL=$(grep -c '^normal$' "$efi_cfg" 2>/dev/null || echo 0)

            echo "has_configfile: $HAS_CONFIGFILE"
            echo "has_source: $HAS_SOURCE"
            echo "has_search_uuid: $HAS_SEARCH"
            echo "has_set_prefix: $HAS_SET_PREFIX"
            echo "has_blscfg: $HAS_BLSCFG"
            echo "has_menuentry: $HAS_MENUENTRY"
            echo "has_mkconfig_markers: $HAS_MKCONFIG"
            echo "has_normal: $HAS_NORMAL"

            # Classify the EFI grub.cfg
            if [ "$LINE_COUNT" -le 10 ] && [ "$HAS_CONFIGFILE" -gt 0 ]; then
              echo "type: redirect_shim"
              echo "redirect_method: configfile"
              echo "status: healthy"
            elif [ "$LINE_COUNT" -le 10 ] && [ "$HAS_SOURCE" -gt 0 ]; then
              echo "type: redirect_shim"
              echo "redirect_method: source"
              echo "status: healthy"
            elif [ "$LINE_COUNT" -le 10 ] && [ "$HAS_NORMAL" -gt 0 ]; then
              echo "type: redirect_shim"
              echo "redirect_method: normal"
              echo "status: healthy"
            elif [ "$HAS_BLSCFG" -gt 0 ] && [ "$HAS_MENUENTRY" -eq 0 ]; then
              echo "type: bls_shim"
              echo "status: healthy"
            elif [ "$HAS_BLSCFG" -gt 0 ] && [ "$HAS_MENUENTRY" -gt 0 ]; then
              echo "type: bls_full_config"
              if [ -n "$BOOT_GRUBCFG" ] && [ -f "$BOOT_GRUBCFG" ]; then
                echo "status: bls_full_config_with_boot"
              else
                echo "status: bls_full_config_efi_only"
              fi
            elif [ "$HAS_MKCONFIG" -gt 0 ] || [ "$HAS_MENUENTRY" -gt 3 ]; then
              echo "type: full_standalone"
              # Check if boot grub.cfg also exists -> diverged
              if [ -n "$BOOT_GRUBCFG" ] && [ -f "$BOOT_GRUBCFG" ]; then
                BOOT_HASH=$(sha256sum "$BOOT_GRUBCFG" 2>/dev/null | cut -d' ' -f1)
                EFI_HASH=$(sha256sum "$efi_cfg" 2>/dev/null | cut -d' ' -f1)
                echo "boot_grubcfg: $BOOT_GRUBCFG"
                echo "boot_grubcfg_hash: $BOOT_HASH"
                echo "efi_grubcfg_hash: $EFI_HASH"
                if [ "$BOOT_HASH" = "$EFI_HASH" ]; then
                  echo "status: full_standalone_identical"
                else
                  echo "status: DIVERGED"
                  echo "warning: EFI and boot grub.cfg are different full configs"
                fi
              else
                echo "status: full_standalone_only_efi"
              fi
            else
              echo "type: unknown"
              echo "status: needs_review"
            fi

            echo "full_content:"
            cat "$efi_cfg" | sed 's/^/  /'
            echo
          done
      register: r_efi_grubcfg_analysis
      changed_when: false
      failed_when: false

    # ─── 13. BLS ─────────────────────────────────────────────────────────────
    - name: Check BLS in /etc/default/grub
      shell: grep -q "GRUB_ENABLE_BLSCFG=true" /etc/default/grub 2>/dev/null
      register: r_bls_grubdefault
      changed_when: false
      failed_when: false

    - name: Check BLS blscfg in grub.cfg
      shell: grep -rl "blscfg" /boot/grub2/grub.cfg /boot/efi/EFI/*/grub.cfg 2>/dev/null || echo "none"
      register: r_bls_grubcfg
      changed_when: false
      failed_when: false

    - name: List /boot/loader tree
      shell: find /boot/loader -type f 2>/dev/null | head -30 || echo "NOT FOUND"
      register: r_boot_loader_tree
      changed_when: false
      failed_when: false

    - name: Get BLS entries
      shell: |
        if [ -d /boot/loader/entries ]; then
          for entry in /boot/loader/entries/*.conf; do
            [ -f "$entry" ] || continue
            echo "--- $(basename "$entry") ---"
            cat "$entry"
            echo
          done
        else
          echo "NOT FOUND"
        fi
      register: r_bls_entries
      changed_when: false
      failed_when: false

    # ─── 14. EFI DIRECTORY STRUCTURE ─────────────────────────────────────────
    - name: List EFI directory tree
      shell: find /boot/efi -type f 2>/dev/null | head -50 || echo "NOT FOUND"
      register: r_efi_tree
      changed_when: false
      failed_when: false

    - name: List EFI vendor dirs
      shell: ls -la /boot/efi/EFI/ 2>/dev/null || echo "NOT FOUND"
      register: r_efi_vendors
      changed_when: false
      failed_when: false

    - name: List EFI binaries
      shell: find /boot/efi -name "*.efi" -exec ls -la {} \; 2>/dev/null || echo "none"
      register: r_efi_binaries
      changed_when: false
      failed_when: false

    # ─── 15. KERNEL & INITRAMFS ──────────────────────────────────────────────
    - name: List kernel files in /boot
      shell: ls -la /boot/vmlinuz* /boot/Image* /boot/kernel* 2>/dev/null || echo "none"
      register: r_kernels
      changed_when: false
      failed_when: false

    - name: List initramfs/initrd files in /boot
      shell: ls -la /boot/initramfs* /boot/initrd* 2>/dev/null || echo "none"
      register: r_initramfs
      changed_when: false
      failed_when: false

    - name: List symlinks in /boot
      shell: find /boot -maxdepth 1 -type l -exec ls -la {} \; 2>/dev/null || echo "none"
      register: r_boot_symlinks
      changed_when: false
      failed_when: false

    - name: List kernel module directories
      shell: ls -d /lib/modules/*/ 2>/dev/null | head -5
      register: r_modules_dirs
      changed_when: false
      failed_when: false

    # ─── 16. DRACUT / INITRAMFS-TOOLS ────────────────────────────────────────
    - name: Get dracut info
      shell: |
        if command -v dracut &>/dev/null; then
          echo "installed: $(dracut --version 2>/dev/null || echo 'version unknown')"
          if [ -f /etc/dracut.conf ]; then
            echo "--- /etc/dracut.conf ---"
            cat /etc/dracut.conf
          fi
          if [ -d /etc/dracut.conf.d ]; then
            echo "--- /etc/dracut.conf.d/ ---"
            ls -la /etc/dracut.conf.d/
            for f in /etc/dracut.conf.d/*.conf; do
              [ -f "$f" ] || continue
              echo "--- $f ---"
              cat "$f"
            done
          fi
        else
          echo "not installed"
        fi
      register: r_dracut
      changed_when: false
      failed_when: false

    - name: Get initramfs-tools info
      shell: |
        if command -v update-initramfs &>/dev/null; then
          echo "installed: yes"
          [ -f /etc/initramfs-tools/initramfs.conf ] && cat /etc/initramfs-tools/initramfs.conf
          [ -f /etc/initramfs-tools/modules ] && echo "--- modules ---" && cat /etc/initramfs-tools/modules
        else
          echo "not installed"
        fi
      register: r_initramfs_tools
      changed_when: false
      failed_when: false

    # ─── 17. SECURE BOOT & SHIM ─────────────────────────────────────────────
    - name: Find shim binaries
      shell: find /boot/efi -name "shim*" -o -name "SHIM*" 2>/dev/null || echo "none"
      register: r_shim_binaries
      changed_when: false
      failed_when: false

    # ─── 18. PACKAGE MANAGER ─────────────────────────────────────────────────
    - name: Detect package managers
      shell: |
        for pm in yum dnf tdnf zypper apt-get; do
          if command -v "$pm" &>/dev/null; then
            echo "$pm: $(command -v "$pm")"
          fi
        done
      register: r_pkgmgr
      changed_when: false
      failed_when: false

    # ─── 19. SERIAL CONSOLE ──────────────────────────────────────────────────
    - name: Get kernel command line
      command: cat /proc/cmdline
      register: r_cmdline
      changed_when: false

    - name: Check console TTY devices
      shell: |
        for tty in ttyS0 ttyS1 ttyAMA0 hvc0; do
          if [ -d "/sys/class/tty/$tty" ]; then
            echo "$tty: present"
          fi
        done
      register: r_tty_devices
      changed_when: false
      failed_when: false

    - name: List serial getty units
      shell: systemctl list-units --type=service 2>/dev/null | grep -iE "getty|serial" || echo "none"
      register: r_getty
      changed_when: false
      failed_when: false

    # ─── 20. HYPER-V MODULES ─────────────────────────────────────────────────
    - name: List loaded Hyper-V modules
      shell: lsmod | grep -iE "hv_|hyperv" || echo "none loaded"
      register: r_hv_loaded
      changed_when: false
      failed_when: false

    - name: Check Hyper-V module type (loadable vs built-in)
      shell:
        cmd: |
          KVER=$(uname -r)
          for mod in hv_vmbus hv_storvsc hv_netvsc; do
            MODPATH=$(find /lib/modules/"$KVER" -name "${mod}.ko*" 2>/dev/null | head -1)
            if [ -n "$MODPATH" ]; then
              echo "$mod: module ($MODPATH)"
            elif grep -q "$mod" /lib/modules/"$KVER"/modules.builtin 2>/dev/null; then
              echo "$mod: built-in"
            else
              echo "$mod: NOT FOUND"
            fi
          done
      register: r_hv_modules
      changed_when: false
      failed_when: false

    # ─── 21. (resolv.conf collected but sanitized — see set_fact) ────────────

    # ═════════════════════════════════════════════════════════════════════════
    # ADDITIONAL DATA FOR OTHER ALAR ACTIONS
    # ═════════════════════════════════════════════════════════════════════════

    # ─── 22. FSTAB ACTION: UUID/device mapping ──────────────────────────────
    # NOTE: blkid, mtab, and resolv.conf are sanitized (not collected) to avoid
    # leaking internal Azure DNS domains and verbose UUID mappings that are
    # already available in fstab, mounts, and disk sections.

    - name: Check for resource disk in fstab
      shell: grep -E "azure_resource|ephemeral|LABEL=BEK" /etc/fstab 2>/dev/null || echo "none"
      register: r_resource_disk
      changed_when: false
      failed_when: false

    - name: Get LVM logical volume details (for fstab rebuild)
      shell: |
        if command -v lvs &>/dev/null; then
          lvs -o lv_name,vg_name,lv_path,lv_size --noheadings 2>/dev/null || echo "no LVs"
        else
          echo "lvm not installed"
        fi
      register: r_lv_details
      changed_when: false
      failed_when: false

    # ─── 23. KERNEL ACTION: default boot kernel, grubby ───────────────────
    - name: Get default boot kernel (grubby)
      shell: grubby --default-kernel 2>/dev/null || echo "grubby not available"
      register: r_default_kernel
      changed_when: false
      failed_when: false

    - name: Get GRUB_DEFAULT value
      shell: grep '^GRUB_DEFAULT=' /etc/default/grub 2>/dev/null || echo "not set"
      register: r_grub_default_entry
      changed_when: false
      failed_when: false

    # ─── 24. INITRD ACTION: dracut-hyperv, module deps ──────────────────────
    - name: Check dracut-hyperv package
      shell: |
        rpm -q dracut-hyperv 2>/dev/null || \
        rpm -q dracut-modules-hyperv 2>/dev/null || \
        dpkg -l hyperv-daemons 2>/dev/null | grep ^ii || \
        echo "not found"
      register: r_dracut_hyperv
      changed_when: false
      failed_when: false

    - name: Get depmod status for running kernel
      shell: depmod -n $(uname -r) 2>/dev/null | head -5 || echo "depmod not available"
      register: r_depmod
      changed_when: false
      failed_when: false

    # ─── 25. AUDITD ACTION: config, disk space, rules ───────────────────────
    - name: Get auditd config
      shell: cat /etc/audit/auditd.conf 2>/dev/null || echo "not found"
      register: r_auditd_conf
      changed_when: false
      failed_when: false

    - name: Check auditd HALT/SUSPEND rules
      shell: grep -iE "HALT|SUSPEND" /etc/audit/auditd.conf 2>/dev/null || echo "none"
      register: r_auditd_halt
      changed_when: false
      failed_when: false

    - name: Get disk usage (df)
      command: df -h
      register: r_df
      changed_when: false
      failed_when: false

    - name: Get LVM VG free space
      shell: vgs -o vg_name,vg_free --noheadings --units m 2>/dev/null || echo "no VGs"
      register: r_vg_free
      changed_when: false
      failed_when: false

    # ─── 26. SUDO ACTION: sudoers perms, ownership, setuid ──────────────────
    - name: Get sudoers file permissions and ownership
      shell: |
        echo "--- /etc/sudoers ---"
        stat -c "%a %U:%G %n" /etc/sudoers 2>/dev/null || echo "not found"
        echo "--- /etc/sudoers.d/ ---"
        for f in /etc/sudoers.d/*; do
          [ -f "$f" ] || continue
          stat -c "%a %U:%G %n" "$f"
        done
      register: r_sudoers_perms
      changed_when: false
      failed_when: false

    - name: Check sudo binary setuid bits
      shell:
        cmd: |
          SUDO_BIN=$(find /usr/bin /bin /usr/sbin /sbin -maxdepth 1 -name sudo \( -type f -o -type l \) 2>/dev/null | head -1)
          if [ -n "$SUDO_BIN" ]; then
            # Resolve symlinks before stat so we get the real binary's permissions
            SUDO_BIN=$(readlink -f "$SUDO_BIN")
            stat -c "%a %U:%G %n" "$SUDO_BIN"
          else
            echo "sudo not found"
          fi
      register: r_sudo_bits
      changed_when: false
      failed_when: false

    - name: Check /etc directory ownership and permissions
      shell: stat -c "%a %U:%G %n" /etc
      register: r_etc_perms
      changed_when: false
      failed_when: false

    - name: Check for targetpw in sudoers
      shell: grep -n "targetpw" /etc/sudoers 2>/dev/null || echo "not found"
      register: r_targetpw
      changed_when: false
      failed_when: false

    - name: Check for duplicate sudo users across sudoers files
      shell:
        cmd: |
          users=""
          for file in /etc/sudoers /etc/sudoers.d/*; do
            [ -f "$file" ] || continue
            grep -E "^[A-Za-z0-9._%-]+\s+ALL" "$file" 2>/dev/null | awk '{print $1}' | while read u; do
              echo "$u $file"
            done
          done | sort | awk '{print $1}' | uniq -d
      register: r_sudoers_dupes
      changed_when: false
      failed_when: false

    - name: Get waagent sudoers file if present
      shell: cat /etc/sudoers.d/waagent 2>/dev/null || echo "not found"
      register: r_waagent_sudoers
      changed_when: false
      failed_when: false

    # ─── 27. GENERAL: cloud-init, waagent ────────────────────────────────────
    - name: Get waagent version and config highlights
      shell: |
        waagent --version 2>/dev/null || echo "waagent not found"
        echo "---"
        grep -E "^(Provisioning|ResourceDisk|AutoUpdate)" /etc/waagent.conf 2>/dev/null || echo "no config"
      register: r_waagent
      changed_when: false
      failed_when: false

    - name: Get cloud-init version
      shell: cloud-init --version 2>/dev/null || echo "not installed"
      register: r_cloudinit
      changed_when: false
      failed_when: false

    # ═════════════════════════════════════════════════════════════════════════
    # BUILD PER-HOST JSON FACT
    # ═════════════════════════════════════════════════════════════════════════
    - name: Build host boot info dictionary
      set_fact:
        host_boot_info:
          identity:
            collected_at: "{{ r_date.stdout }}"
            arch: "{{ r_arch.stdout }}"
            kernel: "{{ r_kernel.stdout }}"
            os_release: "{{ r_os_release.stdout_lines }}"
          imds:
            compute: "{{ (r_imds_compute.stdout | default('{}') | from_json) | dict2items | selectattr('key', 'in', ['publisher', 'offer', 'sku', 'osType', 'vmSize', 'location']) | items2dict }}"
            image_reference: "{{ (r_imds_image.stdout | default('{}') | from_json) | dict2items | selectattr('key', 'in', ['publisher', 'offer', 'sku']) | items2dict }}"
          boot_mode:
            mode: "{{ 'efi' if r_efi_dir.stat.exists else 'bios' }}"
            secure_boot: "{{ r_secureboot.stdout | default('unknown') }}"
          disk:
            block_devices: "{{ r_lsblk.stdout_lines | default([]) }}"
            root_disk: "{{ r_root_disk.stdout | default('unknown') | trim }}"
            partition_table: "{{ r_sgdisk.stdout_lines | default([]) }}"
            nvme_present: "{{ r_nvme.stdout | default('unknown') | trim }}"
            nvme_devices: "{{ r_nvme_list.stdout_lines | default([]) }}"
            scsi_hosts: "{{ r_scsi_hosts.stdout | default('0') | trim }}"
          lvm:
            pvs: "{{ r_pvs.stdout_lines | default([]) }}"
            vgs: "{{ r_vgs.stdout_lines | default([]) }}"
            lvs: "{{ r_lvs.stdout_lines | default([]) }}"
          mounts:
            filesystems: "{{ r_mounts.stdout_lines | default([]) }}"
            efi: "{{ r_efi_mount.stdout_lines | default([]) }}"
            boot: "{{ r_boot_mount.stdout_lines | default([]) }}"
          fstab: "{{ r_fstab.stdout_lines }}"
          grub:
            packages_rpm: "{{ r_grub_pkgs_rpm.stdout_lines | default([]) }}"
            packages_dpkg: "{{ r_grub_pkgs_dpkg.stdout_lines | default([]) }}"
            binaries: "{{ r_grub_binaries.stdout_lines | default([]) }}"
            os_prober: "{{ r_osprober.stdout_lines | default([]) }}"
            default_grub: "{{ r_default_grub.stdout_lines | default([]) }}"
            grubd_listing: "{{ r_grubd_list.stdout_lines | default([]) }}"
            grubd_contents: "{{ r_grubd_contents.stdout_lines | default([]) }}"
            grub_cfgs: "{{ r_grubcfg.stdout_lines | default([]) }}"
            efi_grubcfg_analysis: "{{ r_efi_grubcfg_analysis.stdout_lines | default([]) }}"
          bls:
            enabled_in_grub_default: "{{ r_bls_grubdefault.rc == 0 }}"
            blscfg_in_grub_cfg: "{{ r_bls_grubcfg.stdout_lines | default([]) }}"
            loader_tree: "{{ r_boot_loader_tree.stdout_lines | default([]) }}"
            entries: "{{ r_bls_entries.stdout_lines | default([]) }}"
          efi:
            file_tree: "{{ r_efi_tree.stdout_lines | default([]) }}"
            vendor_dirs: "{{ r_efi_vendors.stdout_lines | default([]) }}"
            efi_binaries: "{{ r_efi_binaries.stdout_lines | default([]) }}"
          kernel:
            kernel_files: "{{ r_kernels.stdout_lines | default([]) }}"
            initramfs_files: "{{ r_initramfs.stdout_lines | default([]) }}"
            boot_symlinks: "{{ r_boot_symlinks.stdout_lines | default([]) }}"
            module_dirs: "{{ r_modules_dirs.stdout_lines | default([]) }}"
          initramfs_tooling:
            dracut: "{{ r_dracut.stdout_lines | default([]) }}"
            initramfs_tools: "{{ r_initramfs_tools.stdout_lines | default([]) }}"
          secure_boot:
            state: "{{ r_secureboot.stdout | default('unknown') }}"
            shim_binaries: "{{ r_shim_binaries.stdout_lines | default([]) }}"
          package_manager: "{{ r_pkgmgr.stdout_lines | default([]) }}"
          serial_console:
            kernel_cmdline: "{{ r_cmdline.stdout }}"
            tty_devices: "{{ r_tty_devices.stdout_lines | default([]) }}"
            getty_units: "{{ r_getty.stdout_lines | default([]) }}"
          hyperv:
            loaded_modules: "{{ r_hv_loaded.stdout_lines | default([]) }}"
            module_types: "{{ r_hv_modules.stdout_lines | default([]) }}"
          resolv_conf:
            - "(sanitized)"
          fstab_detail:
            blkid:
              - "(sanitized)"
            mtab:
              - "(sanitized)"
            resource_disk: "{{ r_resource_disk.stdout_lines | default([]) }}"
            lv_details: "{{ r_lv_details.stdout_lines | default([]) }}"
          kernel_action:
            default_kernel: "{{ r_default_kernel.stdout | default('unknown') }}"
            grub_default: "{{ r_grub_default_entry.stdout | default('not set') }}"
          initrd_action:
            dracut_hyperv: "{{ r_dracut_hyperv.stdout_lines | default([]) }}"
            depmod: "{{ r_depmod.stdout_lines | default([]) }}"
          auditd_action:
            config: "{{ r_auditd_conf.stdout_lines | default([]) }}"
            halt_rules: "{{ r_auditd_halt.stdout_lines | default([]) }}"
            disk_usage: "{{ r_df.stdout_lines | default([]) }}"
            vg_free_space: "{{ r_vg_free.stdout_lines | default([]) }}"
          sudo_action:
            sudoers_perms: "{{ r_sudoers_perms.stdout_lines | default([]) }}"
            sudo_bits: "{{ r_sudo_bits.stdout | default('unknown') }}"
            etc_perms: "{{ r_etc_perms.stdout | default('unknown') }}"
            targetpw: "{{ r_targetpw.stdout | default('not found') }}"
            duplicate_users: "{{ r_sudoers_dupes.stdout_lines | default([]) }}"
            waagent_sudoers: "{{ r_waagent_sudoers.stdout_lines | default([]) }}"
          azure_agent:
            waagent: "{{ r_waagent.stdout_lines | default([]) }}"
            cloud_init: "{{ r_cloudinit.stdout | default('unknown') }}"

# =============================================================================
# Second play: aggregate all hosts into a single JSON file on localhost
# =============================================================================
- name: Write combined JSON report
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Ensure results directory exists
      file:
        path: results
        state: directory

    - name: Find hosts with collected data
      set_fact:
        _collected: "{{ _collected | default([]) + [item] }}"
      loop: "{{ groups['all'] }}"
      when: hostvars[item].host_boot_info is defined
      no_log: true

    - name: Build combined report from all hosts
      set_fact:
        combined_report:
          _meta:
            description: "Consolidated VM reference data - {{ groups['all'] | length }} Azure images"
            total_hosts: "{{ groups['all'] | length }}"
            generated_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          hosts: "{{ dict(_collected | default([]) | zip(_collected | default([]) | map('extract', hostvars, 'host_boot_info'))) }}"

    - name: Ensure /var/www/html directory exists
      become: true
      file:
        path: /var/www/html
        state: directory

    - name: Write /var/www/html/results.json
      become: true
      copy:
        dest: /var/www/html/results.json
        content: "{{ combined_report | to_nice_json }}"

    - name: Generate task validation HTML report
      become: true
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>ALAR Task Validation Report</title>
          <style>
          :root{--b:#edebe9;--t:#201f1e;--m:#605e5c;--p:#0078d4;--hb:#0078d4;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;--sans:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
          *{box-sizing:border-box}
          body{margin:0;font:14px var(--sans);color:var(--t);background:#fff;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
          .hd{background:var(--hb);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
          .hd h1{margin:0;font-size:16px;font-weight:800}
          .hd .sp{flex:1}
          .gb{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:8px;padding:3px 6px;font-size:10px;font-weight:700;cursor:pointer;text-decoration:none}
          .gb:hover{background:rgba(255,255,255,.22)}
          .gb svg{width:14px;height:14px;fill:currentColor}
          .app{display:flex;height:calc(100vh - 42px)}
          .sb{width:300px;min-width:240px;border-right:1px solid var(--b);overflow-y:auto;background:#fafafa;flex-shrink:0}
          .vi{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--b);font-size:12px;display:flex;flex-direction:column;gap:2px}
          .vi:hover{background:#e8f0f8}
          .vi.on{background:var(--p);color:#fff}
          .vi.on .vm{color:rgba(255,255,255,.75)}
          .vi.on .pl{opacity:.9}
          .vn{font-weight:700;font-size:12px}
          .vm{color:var(--m);font-size:11px}
          .vp{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
          .mn{flex:1;overflow-y:auto;padding:16px}
          .pn{display:none}
          .pn.on{display:block}
          .pt{font-size:16px;font-weight:800;margin:0 0 4px}
          .ps{font-size:13px;color:var(--m);margin:0 0 12px}
          .tc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
          @media(max-width:1100px){.tc{grid-template-columns:1fr}}
          .sc{background:#fff;border:1px solid var(--b);border-radius:10px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-top:12px}
          .sc:first-child{margin-top:0}
          .sc h4{font-size:13px;font-weight:900;margin:0 0 6px;color:var(--p);border-bottom:1px solid var(--b);padding-bottom:4px}
          .kv{display:grid;grid-template-columns:150px 1fr;gap:1px 10px;font-size:12px;margin:4px 0}
          .kv .k{font-weight:700;color:var(--m)}.kv .v{word-break:break-all}
          pre.d{background:#f8f8f8;border:1px solid var(--b);border-radius:6px;padding:6px;font:11px/1.35 var(--mono);overflow-x:auto;max-height:220px;white-space:pre-wrap;margin:4px 0}
          .pl{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}
          .pe{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
          .pw{background:#fff7e6;color:#856404;border:1px solid #f3d08b}
          .po{background:#ecfdf3;color:#155724;border:1px solid #b7e3c4}
          .pi{background:#e8f0f8;color:#004085;border:1px solid #c9d8e6}
          </style>
          </head>
          <body>
          <div class="hd">
            <h1>ALAR Task Validation Report</h1>
            <span class="sp"></span>
            <a class="gb" href="results.json" download><svg viewBox="0 0 16 16"><path d="M8 12l-4-4h2.5V3h3v5H12L8 12zm-5 1h10v1H3v-1z"/></svg> JSON</a>
          </div>

          {# ── Macros ── #}
          {% macro kv(l, v) %}<div class="k">{{ l }}</div><div class="v">{{ v }}</div>{% endmacro %}
          {% macro pre(lines) %}<pre class="d">{% for l in lines %}{{ l }}
          {% endfor %}</pre>{% endmacro %}

          {# ── Analyze all hosts ── #}
          {% set all_rows = [] %}
          {% for sku, h in combined_report.hosts.items() | sort %}
            {% set id = h.identity | default({}) %}
            {% set osr_lines = id.os_release | default([]) %}
            {% set os_id_line = osr_lines | select('match', '^ID=') | list | first | default('ID=') %}
            {% set os_id = os_id_line.split('=',1)[1] | default('') | replace('"','') | lower %}
            {% set os_ver_line = osr_lines | select('match', '^VERSION_ID=') | list | first | default('VERSION_ID=') %}
            {% set os_ver = os_ver_line.split('=',1)[1] | default('') | replace('"','') %}
            {% set os_name_line = osr_lines | select('match', '^PRETTY_NAME=') | list | first | default('PRETTY_NAME=') %}
            {% set os_name = os_name_line.split('=',1)[1] | default('') | replace('"','') %}
            {% set arch = id.arch | default('') %}
            {% set imds = h.imds | default({}) %}
            {% set comp = imds.compute | default({}) %}
            {% set publisher = comp.publisher | default('') %}
            {% set offer = comp.offer | default('') %}
            {% set sku_val = comp.sku | default('') %}
            {% set boot = h.boot_mode.mode | default('unknown') %}
            {% set bls_on = h.bls.enabled_in_grub_default | default(false) %}
            {% set bls_entries = h.bls.entries | default([]) | select('search', '\\.conf') | list | length %}
            {% set lvm_vgs = h.lvm.vgs | default([]) | select('search', 'rootvg') | list %}
            {% set has_lvm = lvm_vgs | length > 0 %}
            {% set fstab_lines = h.fstab | default([]) %}
            {% set hv_types = h.hyperv.module_types | default([]) | join(' ') %}
            {% set efi_vendors = h.efi.vendor_dirs | default([]) | join(' ') | lower %}
            {% set osp = h.grub.os_prober | default([]) | join(' ') %}
            {% set mounts_str = h.mounts.filesystems | default([]) | join(' ') %}
            {% set disk_info = h.disk | default({}) %}
            {% set efi_analysis = h.grub.efi_grubcfg_analysis | default([]) | join(' ') %}
            {% set sudo_bits = h.sudo_action.sudo_bits | default('') %}
            {% set cmd_line = h.serial_console.kernel_cmdline | default('') %}
            {% set pkg_mgr = h.package_manager | default([]) | join(' ') %}
            {% set auditd_halt = h.auditd_action.halt_rules | default([]) | join(' ') %}
            {% set sudo_dupes = h.sudo_action.duplicate_users | default([]) %}
            {% set sudo_targetpw = h.sudo_action.targetpw | default('not found') %}
            {% set fns = namespace(style='none') %}
            {% if has_lvm %}{% for line in fstab_lines %}{% if not line.strip().startswith('#') %}{% set parts = line.split() %}{% if parts | length >= 2 and parts[1] == '/' %}{% if 'rootvg' in parts[0] %}{% set fns.style = 'device_mapper' %}{% elif parts[0].startswith('UUID=') %}{% set fns.style = 'uuid' %}{% endif %}{% endif %}{% endif %}{% endfor %}{% endif %}
            {% set f = [] %}
            {% if boot == 'efi' %}{% set _ = f.append(('T01','EFI (bootfix scope)','info')) %}{% endif %}
            {% if 'installed' in osp and 'not installed' not in osp %}{% set _ = f.append(('T02','os-prober installed','warn')) %}{% endif %}
            {% if boot == 'efi' and os_id in ('ubuntu','debian') %}{% set _ = f.append(('T03','Ubuntu/Debian EFI','info')) %}{% endif %}
            {% if arch == 'aarch64' %}{% set _ = f.append(('T04','arm64','info')) %}{% endif %}
            {% if bls_on and bls_entries > 0 %}{% set _ = f.append(('T05','BLS ' ~ bls_entries ~ ' entries','info')) %}{% endif %}
            {% if 'DIVERGED' in efi_analysis %}{% set _ = f.append(('T06','EFI DIVERGED','err')) %}{% endif %}
            {% if os_id in ('sles','opensuse','suse') and 'configfile' in efi_analysis and 'source' not in efi_analysis %}{% set _ = f.append(('T07','SUSE configfile','err')) %}{% endif %}
            {% if os_id in ('azurelinux','mariner') and 'redhat' not in efi_vendors and 'ubuntu' not in efi_vendors %}{% set _ = f.append(('T08','No EFI vendor dir','info')) %}{% endif %}
            {% if 'nvme' in (disk_info.root_disk | default('') | lower) %}{% set _ = f.append(('T09','NVMe root','info')) %}{% elif disk_info.nvme_present | default('no') == 'yes' %}{% set _ = f.append(('T09','NVMe hw only','ok')) %}{% endif %}
            {% if bls_on and bls_entries == 0 %}{% set _ = f.append(('T10','BLS NO entries','err')) %}{% endif %}
            {% if 'builtin' in hv_types %}{% set _ = f.append(('T12','HV built-in','ok')) %}{% elif 'module' in hv_types %}{% set _ = f.append(('T12','HV loadable','info')) %}{% endif %}
            {% if boot == 'efi' and os_id == 'debian' and 'debian' not in efi_vendors %}{% set _ = f.append(('T13','Debian vendor missing','warn')) %}{% endif %}
            {% if boot == 'bios' %}{% set _ = f.append(('T14','BIOS','info')) %}{% endif %}
            {% if arch == 'aarch64' and 'ttyAMA0' not in cmd_line and 'console=' in cmd_line %}{% set _ = f.append(('T15','no ttyAMA0','warn')) %}{% endif %}
            {% if arch == 'x86_64' and 'ttyS0' in cmd_line %}{% set _ = f.append(('T15','ttyS0 OK','ok')) %}{% endif %}
            {% if '/alternatives/' in sudo_bits or '/cargo/' in sudo_bits %}{% set _ = f.append(('T16','sudo-rs','info')) %}{% endif %}
            {% if os_id in ('azurelinux','mariner') and 'tdnf' in pkg_mgr %}{% set _ = f.append(('T17','tdnf','info')) %}{% endif %}
            {% if 'not installed' in osp %}{% set _ = f.append(('T18','No os-prober','ok')) %}{% endif %}
            {% if 'btrfs' in mounts_str %}{% set _ = f.append(('T19','btrfs','warn')) %}{% endif %}
            {% if '4111' in sudo_bits %}{% set _ = f.append(('T20','sudo 4111','info')) %}{% elif '4755' in sudo_bits %}{% set _ = f.append(('T20','sudo 4755','ok')) %}{% endif %}
            {% if bls_on %}{% set _ = f.append(('T21','BLS rollback','info')) %}{% endif %}
            {% if 'builtin' in hv_types %}{% set _ = f.append(('T23','skip drivers','ok')) %}{% endif %}
            {% if has_lvm and fns.style == 'uuid' %}{% set _ = f.append(('T25','LVM+UUID BROKEN','err')) %}{% elif has_lvm and fns.style == 'device_mapper' %}{% set _ = f.append(('T25','LVM mapper OK','ok')) %}{% elif has_lvm %}{% set _ = f.append(('T25','LVM','info')) %}{% endif %}
            {% if 'HALT' in auditd_halt | upper %}{% set _ = f.append(('T26','auditd HALT','warn')) %}{% endif %}
            {% if sudo_dupes | length > 0 %}{% set _ = f.append(('T27','sudo dupes','warn')) %}{% endif %}
            {% if 'targetpw' in sudo_targetpw and 'not found' not in sudo_targetpw %}{% set _ = f.append(('T28','targetpw','warn')) %}{% endif %}
            {% set _ = all_rows.append({'sku': sku, 'publisher': publisher, 'offer': offer, 'sku_val': sku_val, 'arch': arch, 'boot': boot, 'os_name': os_name, 'os_id': os_id, 'os_ver': os_ver, 'findings': f, 'h': h, 'has_lvm': has_lvm, 'fstab_lvm_style': fns.style, 'bls_entries': bls_entries, 'idx': loop.index0}) %}
          {% endfor %}

          <div class="app">
          {# ── Sidebar ── #}
          <div class="sb" id="sb">
          {% for r in all_rows %}
          <div class="vi{% if loop.first %} active{% endif %}" onclick="showVM({{ r.idx }})" id="n{{ r.idx }}">
            <span class="vn">{{ r.publisher }} / {{ r.sku_val }}</span>
            <span class="vm">{{ r.os_name }} &mdash; {{ r.arch }} / {{ r.boot }}</span>
            {% set ew = r.findings | selectattr(2, 'in', ['err','warn']) | list %}
            {% if ew | length > 0 %}<span class="vp">{% for t, m, s in ew %}<span class="pl p{{ s[0] }}">{{ m }}</span>{% endfor %}</span>{% endif %}
          </div>
          {% endfor %}
          </div>

          {# ── Main panels ── #}
          <div class="mn" id="mn">
          {% for r in all_rows %}
          {% set h = r.h %}
          <div class="pn{% if loop.first %} active{% endif %}" id="v{{ r.idx }}">
            <div class="pt">{{ r.publisher }} / {{ r.offer }} / {{ r.sku_val }}</div>
            <div class="ps">{{ r.os_name }} &mdash; {{ r.arch }} / {{ r.boot }} &mdash; Kernel {{ h.identity.kernel | default('') }}</div>

            <div class="tc">
              {# ── Col 1: System, Disk, Kernel, Modules, Agent ── #}
              <div>
                <div class="sc"><h4>Identity &amp; Image</h4>
                <div class="kv">
                {{ kv('Publisher', r.publisher) }}{{ kv('Offer', r.offer) }}{{ kv('SKU', r.sku_val) }}
                {{ kv('OS', r.os_name) }}{{ kv('OS ID', r.os_id) }}{{ kv('Version', r.os_ver) }}
                {{ kv('Architecture', r.arch) }}{{ kv('Kernel', h.identity.kernel | default('')) }}
                {{ kv('VM Size', h.imds.compute.vmSize | default('')) }}{{ kv('Collected', h.identity.collected_at | default('')) }}
                </div></div>

                <div class="sc" style="margin-top:12px"><h4>Boot Mode</h4>
                <div class="kv">{{ kv('Mode', r.boot) }}{{ kv('Secure Boot', h.boot_mode.secure_boot | default('unknown')) }}</div></div>

                <div class="sc" style="margin-top:12px"><h4>Disk &amp; Partitions</h4>
                <div class="kv">{{ kv('Root Disk', h.disk.root_disk | default('')) }}{{ kv('NVMe', h.disk.nvme_present | default('no')) }}{{ kv('SCSI Hosts', h.disk.scsi_hosts | default('')) }}</div>
                {% if h.disk.nvme_present | default('no') == 'yes' %}<b>NVMe Devices:</b>{{ pre(h.disk.nvme_devices | default([])) }}{% endif %}
                {{ pre(h.disk.block_devices | default([])) }}
                {% if h.disk.partition_table | default([]) | length > 0 %}{{ pre(h.disk.partition_table) }}{% endif %}
                </div>

                {% if h.lvm.vgs | default([]) | length > 0 %}
                <div class="sc" style="margin-top:12px"><h4>LVM</h4>
                <b>VGs:</b>{{ pre(h.lvm.vgs) }}<b>LVs:</b>{{ pre(h.lvm.lvs | default([])) }}<b>PVs:</b>{{ pre(h.lvm.pvs | default([])) }}
                </div>{% endif %}

                <div class="sc" style="margin-top:12px"><h4>Mount Points</h4>
                {{ pre(h.mounts.filesystems | default([])) }}
                <div class="kv">{{ kv('EFI', h.mounts.efi | default([]) | join(' ')) }}{{ kv('Boot', h.mounts.boot | default([]) | join(' ')) }}</div>
                </div>

                <div class="sc" style="margin-top:12px"><h4>Fstab</h4>
                {% if r.has_lvm %}<div class="kv">{{ kv('LVM Style', r.fstab_lvm_style) }}</div>{% endif %}
                {{ pre(h.fstab | default([])) }}
                </div>

                {% if h.fstab_detail.resource_disk | default([]) | length > 0 %}
                <div class="sc" style="margin-top:12px"><h4>Fstab Detail</h4>
                <b>Resource disk:</b>{{ pre(h.fstab_detail.resource_disk) }}
                {% if h.fstab_detail.lv_details | default([]) | length > 0 %}<b>LV details:</b>{{ pre(h.fstab_detail.lv_details) }}{% endif %}
                </div>{% endif %}

                <div class="sc" style="margin-top:12px"><h4>Kernel &amp; Initramfs</h4>
                <b>Kernels:</b>{{ pre(h.kernel.kernel_files | default([])) }}
                <b>Initramfs:</b>{{ pre(h.kernel.initramfs_files | default([])) }}
                <b>Symlinks:</b>{{ pre(h.kernel.boot_symlinks | default([])) }}
                <b>Modules:</b>{{ pre(h.kernel.module_dirs | default([])) }}
                </div>

                <div class="sc" style="margin-top:12px"><h4>Initramfs Tooling</h4>
                {{ pre(h.initramfs_tooling.dracut | default([])) }}
                {{ pre(h.initramfs_tooling.initramfs_tools | default([])) }}
                </div>

                <div class="sc" style="margin-top:12px"><h4>Hyper-V Modules</h4>
                <b>Type:</b>{{ pre(h.hyperv.module_types | default([])) }}
                <b>Loaded:</b>{{ pre(h.hyperv.loaded_modules | default([])) }}
                </div>

                <div class="sc" style="margin-top:12px"><h4>Package Manager</h4>
                {{ pre(h.package_manager | default([])) }}
                </div>

                <div class="sc" style="margin-top:12px"><h4>Azure Agent</h4>
                {{ pre(h.azure_agent.waagent | default([])) }}
                <div class="kv">{{ kv('cloud-init', h.azure_agent.cloud_init | default('')) }}</div>
                </div>
              </div>

              {# ── Col 2: GRUB, EFI, BLS, Serial, Security ── #}
              <div>
                <div class="sc"><h4>GRUB Configuration</h4>
                <div class="kv">{{ kv('GRUB Path', '/boot/grub2/' if 'grub2-install' in (h.grub.binaries | default([]) | join(' ')) else '/boot/grub/') }}</div>
                <b>/etc/default/grub:</b>{{ pre(h.grub.default_grub | default([])) }}
                {% if h.grub.grubd_contents | default([]) | length > 1 %}<b>grub.d:</b>{{ pre(h.grub.grubd_contents) }}{% endif %}
                </div>

                <div class="sc" style="margin-top:12px"><h4>GRUB Packages &amp; Binaries</h4>
                {% if h.grub.packages_rpm | default([]) | length > 0 %}<b>RPM:</b>{{ pre(h.grub.packages_rpm) }}{% endif %}
                {% if h.grub.packages_dpkg | default([]) | length > 0 %}<b>DPKG:</b>{{ pre(h.grub.packages_dpkg) }}{% endif %}
                <b>Binaries:</b>{{ pre(h.grub.binaries | default([])) }}
                <b>os-prober:</b>{{ pre(h.grub.os_prober | default([])) }}
                </div>

                <div class="sc" style="margin-top:12px"><h4>grub.cfg Files</h4>
                {{ pre(h.grub.grub_cfgs | default([])) }}
                </div>

                <div class="sc" style="margin-top:12px"><h4>EFI grub.cfg Analysis</h4>
                {{ pre(h.grub.efi_grubcfg_analysis | default([])) }}
                </div>

                <div class="sc" style="margin-top:12px"><h4>BLS</h4>
                <div class="kv">{{ kv('Enabled', h.bls.enabled_in_grub_default | default(false)) }}{{ kv('Entries', r.bls_entries) }}</div>
                {% if h.bls.entries | default([]) | length > 1 %}{{ pre(h.bls.entries) }}{% endif %}
                </div>

                {% if r.boot == 'efi' %}
                <div class="sc" style="margin-top:12px"><h4>EFI Directory</h4>
                <b>Vendor dirs:</b>{{ pre(h.efi.vendor_dirs | default([])) }}
                <b>Binaries:</b>{{ pre(h.efi.efi_binaries | default([])) }}
                <b>Tree:</b>{{ pre(h.efi.file_tree | default([])) }}
                </div>{% endif %}

                <div class="sc" style="margin-top:12px"><h4>Secure Boot &amp; Shim</h4>
                <div class="kv">{{ kv('State', h.secure_boot.state | default('unknown')) }}</div>
                {{ pre(h.secure_boot.shim_binaries | default([])) }}
                </div>

                <div class="sc" style="margin-top:12px"><h4>Serial Console</h4>
                <div class="kv">{{ kv('Cmdline', h.serial_console.kernel_cmdline | default('')) }}</div>
                <b>TTY:</b>{{ pre(h.serial_console.tty_devices | default([])) }}
                <b>Getty:</b>{{ pre(h.serial_console.getty_units | default([])) }}
                </div>

                <div class="sc" style="margin-top:12px"><h4>Kernel Rollback</h4>
                <div class="kv">{{ kv('Default', h.kernel_action.default_kernel | default('')) }}{{ kv('GRUB_DEFAULT', h.kernel_action.grub_default | default('')) }}</div>
                </div>

                <div class="sc" style="margin-top:12px"><h4>Initrd Details</h4>
                {{ pre(h.initrd_action.dracut_hyperv | default([])) }}
                </div>

                <div class="sc" style="margin-top:12px"><h4>Sudo &amp; Permissions</h4>
                <div class="kv">{{ kv('sudo bits', h.sudo_action.sudo_bits | default('')) }}{{ kv('/etc perms', h.sudo_action.etc_perms | default('')) }}{{ kv('targetpw', h.sudo_action.targetpw | default('not found')) }}{{ kv('Duplicates', h.sudo_action.duplicate_users | default([]) | join(', ') or 'none') }}</div>
                <b>Sudoers:</b>{{ pre(h.sudo_action.sudoers_perms | default([])) }}
                <b>waagent:</b>{{ pre(h.sudo_action.waagent_sudoers | default([])) }}
                </div>

                <div class="sc" style="margin-top:12px"><h4>Auditd</h4>
                <div class="kv">{{ kv('HALT/SUSPEND', h.auditd_action.halt_rules | default([]) | join(' ')) }}</div>
                <b>Disk usage:</b>{{ pre(h.auditd_action.disk_usage | default([])) }}
                {% if h.auditd_action.vg_free_space | default([]) | length > 0 %}<b>VG free:</b>{{ pre(h.auditd_action.vg_free_space) }}{% endif %}
                </div>
              </div>
            </div>
          </div>
          {% endfor %}
          </div>
          </div>

          <script>
          function showVM(i){document.querySelectorAll('.vi').forEach(function(e){e.classList.remove('on')});document.querySelectorAll('.pn').forEach(function(e){e.classList.remove('on')});document.getElementById('n'+i).classList.add('on');document.getElementById('v'+i).classList.add('on');document.getElementById('mn').scrollTop=0}
          </script>
          </body>
          </html>
